name: Deploy staging

# Runs after Release gates succeed on main (avoids re-running the full gate).
on:
  workflow_run:
    workflows: ["Release gates"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy-api:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy API to Fly.io
        run: flyctl deploy --remote-only --app parline-api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  deploy-web:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install and build web
        working-directory: apps/web
        env:
          VITE_API_URL: https://parline-api.fly.dev
          VITE_WORKOS_CLIENT_ID: ${{ secrets.VITE_WORKOS_CLIENT_ID }}
          VITE_SETUP_BOOKING_URL: https://cal.com/fola-aluko-7tzoaq/parline-setup
        run: |
          if [ -z "$VITE_WORKOS_CLIENT_ID" ]; then
            echo "VITE_WORKOS_CLIENT_ID secret is required" >&2
            exit 1
          fi
          npm ci
          npm run build
      - name: Deploy web to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          MSG="$(git log -1 --pretty=%s)"
          npx --yes wrangler@4 pages deploy apps/web/dist \
            --project-name=parline \
            --branch main \
            --commit-dirty=true \
            --commit-hash "$SHA" \
            --commit-message "$MSG"
