# Parline API — Fly.io staging/MVP
# Deploy from repo root: fly deploy
# Dockerfile expects workspace layout (Cargo.toml + apps/api).

app = 'parline-api'
primary_region = 'iad'

[build]
  dockerfile = 'apps/api/Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '30s'
    method = 'GET'
    path = '/health/live'

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '45s'
    method = 'GET'
    path = '/health/ready'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
